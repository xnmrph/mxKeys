[package]
name = "mxkeys"
version = "0.1.0"
description = "All-in-one ZMK keyboard app"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "mxkeys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
zmk-config = { path = "../crates/zmk-config" }
mxkeys-flash = { path = "../crates/flash" }
mxkeys-git = { path = "../crates/git" }
mxkeys-hardware = { path = "../crates/hardware" }
mxkeys-probe = { path = "../crates/probe" }
mxkeys-toolchain = { path = "../crates/toolchain" }
mxkeys-niceview = { path = "../crates/niceview" }
base64 = "0.22"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
