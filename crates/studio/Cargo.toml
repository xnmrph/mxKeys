[package]
name = "mxkeys-studio"
version = "0.1.0"
description = "ZMK Studio RPC client for mxKeys: framing, protobuf messages, USB/BLE transports, a simulated keyboard"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
prost = "0.13"
serde.workspace = true
thiserror.workspace = true
zmk-config = { path = "../zmk-config" }
serialport = "4.10"
btleplug = "0.13"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures = "0.3"
uuid = "1"
