[workspace]
resolver = "2"
members = ["crates/zmk-config"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/xnmrph/mxKeys"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
