name: Installers

# Builds unsigned installers. Runs on manual dispatch, or on a push whose commit
# message contains "[installers]". With "[release]" it also publishes a GitHub
# release v<package.json version> with the installers and docs/releases/<version>.md.
on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[installers]') || contains(github.event.head_commit.message, '[release]')
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: --bundles appimage,deb
          - name: macos-apple-silicon
            os: macos-latest
            args: --bundles app,dmg
          - name: windows-x86_64
            os: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libudev-dev libssl-dev libdbus-1-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installers
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: mxKeys-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  release:
    if: contains(github.event.head_commit.message, '[release]')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: mxKeys ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: docs/releases/${{ steps.v.outputs.version }}.md
          fail_on_unmatched_files: true
          files: dist/*
