name: Installers

# Builds unsigned installers.
# - Releases: every push to `main` whose package.json version has no release yet
#   publishes v<version> with the installers and docs/releases/<version>.md.
#   (Develop on `dev`; merge into `main` after bumping the version to release.)
# - Test installers: manual dispatch, or a push whose commit message contains "[installers]".
on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.plan.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
              echo "::notice::v$v is already released; bump the version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json to release again."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[installers]') || needs.plan.outputs.release == 'true'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: --bundles appimage,deb
          - name: macos-apple-silicon
            os: macos-latest
            args: --bundles app,dmg
          - name: windows-x86_64
            os: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libudev-dev libssl-dev libdbus-1-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installers
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: mxKeys-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  release:
    if: needs.plan.outputs.release == 'true'
    needs: [plan, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Artifacts keep their bundle/<kind>/ folders; the release wants a flat list.
      - run: |
          mkdir out
          find dist -type f -exec mv {} out/ \;
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: mxKeys ${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: docs/releases/${{ needs.plan.outputs.version }}.md
          fail_on_unmatched_files: true
          files: out/*
