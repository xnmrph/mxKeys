# mxKeys managed toolchain — every pinned version, URL and checksum in one place.
#
# Changing anything here changes the toolchain directory hash, so the app installs the
# new toolchain next to the old one (and can clean up the old one later).
# See docs/build-toolchain.md for how these were chosen and measured.

schema = 1

[zephyr_sdk]
# Must match the SDK ZMK itself builds with — zmkfirmware/zmk-docker, branch 4.1-branch,
# `zephyr-sdk-version: 0.16.9` (Zephyr 4.1.0). SDK 0.17.x fails to compile Zephyr 4.1's
# picolibc lock code (conflicting `__lock___libc_recursive_mutex`).
version = "0.16.9"
toolchain = "arm-zephyr-eabi"

[python]
version = "3.12.16"
# Installed into the venv before the west workspace exists.
bootstrap = ["west==1.5.0"]
# Installed from the workspace after `west update` (paths relative to the workspace).
# Deliberately NOT `west packages pip --install`, which pulls all of Zephyr's developer
# tooling (~285 MB venv instead of ~60 MB). nanopb's extras bring `grpcio-tools`, which
# bundles `protoc` (needed for ZMK Studio's protobuf messages).
workspace_requirements = [
  "zephyr/scripts/requirements-base.txt",
  "modules/lib/nanopb/extra/requirements.txt",
]

[workspace]
# Projects kept from ZMK's `app/west.yml` import (applied transitively to Zephyr's own
# module list). Everything a nice!nano/nRF52840 ZMK build compiles or reads. The user's
# own extra projects (e.g. urob/zmk-helpers) are always kept. If a build reports a
# missing module the app falls back to the full, unfiltered manifest.
allowlist = [
  "zephyr",
  "cmsis",
  "cmsis_6",
  "hal_nordic",
  "mbedtls",
  "nanopb",
  "lvgl",
  "zmk-studio-messages",
  "tinycrypt",
  "segger",
]
clone_depth = 1

# Paths removed after extraction (relative to the component's install dir; globs ok).
[trim]
cmake = ["doc", "man", "share/cmake-3.31/Help"]
zephyr_sdk = ["zephyr-sdk-*-hosttools-standalone-*.sh"]

# ---------------------------------------------------------------------------------------
# Artifacts. `strip` = leading path components removed when extracting; `dest` is
# relative to the toolchain root. Checksums are the publishers' own (sha256.sum,
# SHA-256.txt, SHA256SUMS) except ninja, which publishes none (hashed on download).
# ---------------------------------------------------------------------------------------

